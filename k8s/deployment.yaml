apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: ghcr.io/purvapatil1/devops-production-project:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

          # Load environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: flask-config

          # Load DEMO_TOKEN from Kubernetes Secret
          env:
            - name: DEMO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: flask-secret
                  key: DEMO_TOKEN

          # Check whether the application is ready
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          # Restart the container if the application becomes unhealthy
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
